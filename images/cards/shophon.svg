<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="shophonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="20" y="20" width="560" height="340" rx="24" fill="url(#shophonGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Overlay Pattern -->
  <circle cx="500" cy="80" r="140" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="100" cy="300" r="160" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Gold Stripe -->
  <path d="M 20 280 Q 300 240 580 290 L 580 344 A 24 24 0 0 1 556 360 L 44 360 A 24 24 0 0 1 20 336 Z" fill="url(#goldAccent)" opacity="0.95"/>

  <!-- Brand Header -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M 14 16 L 34 16 L 31 34 L 17 34 Z M 19 16 A 5 5 0 0 1 29 16" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="64" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">SHOPHON PK</text>
    <text x="64" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#D1FAE5" letter-spacing="2">OFFICIAL REWARD CARD</text>
  </g>

  <!-- Chip Icon -->
  <rect x="60" y="165" width="52" height="40" rx="8" fill="#FCD34D" stroke="#D97706" stroke-width="1.5"/>
  <line x1="60" y1="185" x2="112" y2="185" stroke="#B45309" stroke-width="1.5"/>
  <line x1="86" y1="165" x2="86" y2="205" stroke="#B45309" stroke-width="1.5"/>

  <!-- Card Details -->
  <text x="60" y="248" font-family="monospace" font-size="18" fill="#ffffff" letter-spacing="4">8842 •••• •••• 9841</text>
  <text x="60" y="320" font-family="system-ui, sans-serif" font-weight="700" font-size="26" fill="#0F172A">PKR 300 - 1000</text>
  <text x="440" y="320" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#0F172A" text-anchor="end">PAKISTAN VERIFIED</text>
</svg>
